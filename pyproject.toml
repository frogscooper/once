[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-once"
version = "0.1.0"
description = "Run side-effecting agent tool calls at most once per idempotency key."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "frogscooper" }]
keywords = ["idempotency", "agents", "tools", "retry", "sqlite", "postgres"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
once = "once.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "hypothesis", "ruff", "mypy", "opentelemetry-sdk"]
postgres = ["psycopg[binary]>=3.1"]
otel = ["opentelemetry-api>=1.20"]
stripe = ["stripe>=8"]
mcp = ["mcp"]
langchain = ["langchain-core", "langgraph"]
openai-agents = ["openai-agents"]
pydantic-ai = ["pydantic-ai-slim"]
crewai = ["crewai"]

[tool.hatch.build.targets.wheel]
packages = ["src/once"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not heavy'"
markers = ["heavy: slow stress tests, run with -m heavy"]

[tool.coverage.run]
branch = true
source = ["once"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"
# checks the integration tests and examples too, so install .[dev,postgres,stripe,mcp,langchain]
files = ["src", "tests", "examples"]
# their pins conflict, so CI checks these in the adapters job, one framework at a time
exclude = ['(openai_agents|pydantic_ai|crewai)_example\.py$', 'test_integrations_(openai_agents|pydantic_ai|crewai)\.py$']
