name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,postgres]" mcp langchain-core langgraph
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  # Linux runs every test against both SQLite and a Postgres service container.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: once_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      ONCE_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/once_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,postgres]"
      - run: pytest -q --cov=once --cov-report=term-missing
      - if: matrix.python-version == '3.12'
        run: pytest -q -m heavy tests/test_stress.py

  # Service containers only run on Linux, so these skip the Postgres tests and
  # leave postgres.py out of the coverage floor.
  test-other:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q --cov=once --cov-fail-under=0
      - run: coverage report --omit="*postgres.py" --fail-under=95 --show-missing

  integrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mcp: ["mcp<2", "mcp>=2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" langchain-core langgraph "${{ matrix.mcp }}"
      - run: pytest -q tests/test_integrations.py tests/test_integrations_mcp.py tests/test_integrations_langchain.py
      - run: python examples/langgraph_example.py
      - run: python examples/mcp_server.py --demo
      - run: pytest -q -m heavy tests/test_stress.py
